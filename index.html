<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMEN — Residences on the Lagoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4efe8; --ink-dim:rgba(244,239,232,.68); --gold:#d9b779; --line:rgba(244,239,232,.22);
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0a0e15;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#runway{height:640vh}
#stage{position:fixed;inset:0;overflow:hidden;background:#0a0e15}

/* blurred backdrops fill the bands beside the portrait image */
.bd{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(38px) saturate(1.05);transition:opacity 1.4s ease}
#bdNight{opacity:0}
body.night #bdNight{opacity:1}

.world{position:absolute;left:0;top:0;transform-origin:0 0;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 6%,#000 94%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 6%,#000 94%,transparent);
  mask-composite:intersect}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#nightLayer{opacity:0;transition:opacity 1.4s ease}
body.night #nightLayer{opacity:1}
.hotspots{position:absolute;inset:0}

/* hotspots */
.hs{position:absolute;width:0;height:0;opacity:0;pointer-events:none;transition:opacity .8s ease}
.hs.show{opacity:1;pointer-events:auto}
.hs .in{position:absolute;left:0;top:0;transform:scale(calc(1 / var(--s,1)));transform-origin:0 0;display:flex;align-items:center;gap:14px;white-space:nowrap}
.hs .dot{position:relative;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 5px rgba(255,255,255,.22)}
.hs .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(255,255,255,.7);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.hs .tag{padding:9px 16px 9px 14px;border-radius:40px;background:rgba(12,16,24,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);text-align:left;transition:background .25s,transform .25s}
.hs:hover .tag,.hs:focus-visible .tag{background:rgba(12,16,24,.8);transform:translateX(3px)}
.hs .tag b{display:block;font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.02em}
.hs .tag span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-top:1px}
.hs:focus-visible{outline:none}
.hs:focus-visible .tag{outline:2px solid var(--gold)}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,4vw,44px);pointer-events:none}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:.42em;pointer-events:auto;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.toggle{pointer-events:auto;display:flex;gap:4px;padding:4px;border-radius:40px;background:rgba(12,16,24,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2)}
.toggle button{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);transition:all .3s}
.toggle button svg{width:15px;height:15px}
.toggle button.on{background:var(--ink);color:#10141c}
.toggle button:focus-visible{outline:2px solid var(--gold)}

/* captions */
.cap{position:fixed;z-index:10;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease,transform .6s ease;padding:0 24px;text-shadow:0 2px 30px rgba(0,0,0,.45)}
.cap h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,9vw,118px);letter-spacing:.34em;margin:0;padding-left:.34em;line-height:1}
.cap p{margin:14px 0 0;font-size:clamp(11px,1.3vw,14px);letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim)}
.cap.big{bottom:13vh;transform:translateY(14px)}
.cap.mid{bottom:11vh;transform:translateY(14px)}
.cap.mid h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4vw,52px);margin:0;letter-spacing:.02em;font-style:italic}
.cap.on{opacity:1;transform:none}
.cue{position:fixed;z-index:10;left:50%;bottom:30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim);transition:opacity .5s;pointer-events:none}
.cue i{display:block;width:1px;height:42px;background:linear-gradient(var(--ink),transparent);animation:drip 2s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* unit panel */
#panel{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);background:#0c1017;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease,visibility 0s .55s}
#panel.open{opacity:1;visibility:visible;transform:none;transition:opacity .55s ease,transform .55s ease}
.close{position:absolute;top:18px;right:18px;z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(12,16,24,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
.close:focus-visible,.tab:focus-visible,.upill:focus-visible{outline:2px solid var(--gold)}
.close svg{width:16px;height:16px}
.viewer{position:relative;overflow:hidden;background:#05070b;min-height:0}
.pan{position:absolute;inset:0;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pan.drag{cursor:grabbing}
.pan img{position:absolute;top:50%;left:0;transform:translateY(-50%);display:block;max-width:none;-webkit-user-drag:none;transition:opacity .5s}
.pan img.fade{opacity:0}
.vhint{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:30px;background:rgba(12,16,24,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);pointer-events:none;transition:opacity .6s}
.vhint svg{width:18px;height:18px}
.vhint.gone{opacity:0}
.tabs{position:absolute;left:0;right:0;bottom:24px;z-index:4;display:flex;justify-content:center;gap:8px;padding:0 16px}
.tab{padding:11px 20px;border-radius:40px;background:rgba(12,16,24,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);transition:all .25s}
.tab.on{background:var(--ink);color:#10141c;border-color:var(--ink)}
.info{overflow-y:auto;padding:34px clamp(24px,3.4vw,52px) 40px;border-left:1px solid var(--line)}
.units{display:flex;gap:8px;flex-wrap:wrap;margin:0 56px 30px 0}
.upill{padding:8px 14px;border-radius:30px;border:1px solid var(--line);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);transition:all .25s}
.upill.on{border-color:var(--gold);color:var(--gold)}
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.info h2{font-family:var(--serif);font-weight:400;font-size:clamp(36px,4vw,54px);line-height:1.02;margin:0 0 16px}
.desc{font-weight:300;line-height:1.65;color:var(--ink-dim);margin:0 0 26px;font-size:15px;max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:15px 0;border-right:1px solid var(--line);padding-left:14px}
.stats div:first-child{padding-left:0}
.stats div:last-child{border-right:0}
.stats dt{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.stats dd{margin:0;font-family:var(--serif);font-size:25px}
.plan h3{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-dim);font-weight:400;margin:0 0 12px}
.plan svg{width:100%;height:auto;display:block;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:6px}
.plan .wall{fill:none;stroke:rgba(244,239,232,.9);stroke-width:2.2;stroke-linejoin:round}
.plan .int{fill:none;stroke:rgba(244,239,232,.7);stroke-width:1.2}
.plan .terr{fill:none;stroke:rgba(217,183,121,.8);stroke-width:1;stroke-dasharray:4 4}
.plan .soft{fill:rgba(217,183,121,.07);stroke:rgba(217,183,121,.55);stroke-width:1}
.plan .glass{fill:none;stroke:#8fc7e6;stroke-width:2.2}
.plan text{font-family:var(--sans);fill:rgba(244,239,232,.85);font-size:8.6px;letter-spacing:.13em;text-anchor:middle}
.plan .ar{fill:var(--gold);font-size:7.6px;letter-spacing:.08em}
.note{font-size:11px;color:var(--ink-dim);margin:18px 0 0;line-height:1.5;opacity:.8}

@media (max-width:860px){
  #panel{grid-template-columns:1fr;grid-template-rows:46vh minmax(0,1fr)}
  .info{border-left:0;border-top:1px solid var(--line);padding-top:26px}
  .tabs{bottom:14px}.tab{padding:9px 14px;font-size:10.5px}
  .stats dd{font-size:21px}
  .hs .tag b{font-size:15px}
  .toggle button{padding:7px 12px;font-size:11px}
  .toggle button span{display:none}
  .brand{font-size:18px}
}
#loader{position:fixed;inset:0;z-index:100;background:#0a0e15;display:grid;place-items:center;font-family:var(--serif);font-size:22px;letter-spacing:.5em;transition:opacity .9s ease,visibility 0s .9s}
#loader.done{opacity:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){.hs .dot::after,.cue i{animation:none}}
</style>
</head>
<body class="night">
<div id="loader">LUMEN</div>

<header class="top">
  <div class="brand">LUMEN</div>
  <div class="toggle" role="group" aria-label="Time of day">
    <button type="button" data-mode="day" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg><span>Day</span>
    </button>
    <button type="button" data-mode="night" class="on" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><span>Night</span>
    </button>
  </div>
</header>

<div id="runway"></div>

<div id="stage" aria-label="Interactive tower">
  <img class="bd" id="bdDay" alt="" src="day_web.webp">
  <img class="bd" id="bdNight" alt="" src="night_web.webp">
  <div class="world" id="world">
    <img class="layer" id="dayLayer" alt="Lumen tower by day" src="day_web.webp">
    <img class="layer" id="nightLayer" alt="Lumen tower at night" src="night_web.webp">
    <div class="hotspots">
      <button class="hs" type="button" data-unit="c" style="left:60%;top:28.6%" aria-label="Open the Penthouse"><div class="in"><span class="dot"></span><span class="tag"><b>Penthouse</b><span>Level 12</span></span></div></button>
      <button class="hs" type="button" data-unit="b" style="left:60%;top:37.2%" aria-label="Open the Sky Residence"><div class="in"><span class="dot"></span><span class="tag"><b>Sky Residence</b><span>Level 08</span></span></div></button>
      <button class="hs" type="button" data-unit="a" style="left:60%;top:49.6%" aria-label="Open the Garden Residence"><div class="in"><span class="dot"></span><span class="tag"><b>Garden Residence</b><span>Level 03</span></span></div></button>
    </div>
  </div>
</div>

<div class="cap big on" id="capA"><h1>LUMEN</h1><p>Residences on the Lagoon</p></div>
<div class="cap mid" id="capB"><h2>Terraces suspended above the water.</h2></div>
<div class="cap mid" id="capC"><h2>Three residences. Choose one.</h2></div>
<div class="cue" id="cue"><span>Scroll to enter</span><i></i></div>

<section id="panel" role="dialog" aria-modal="true" aria-labelledby="pName" aria-hidden="true">
  <button class="close" type="button" id="closeBtn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="viewer">
    <div class="pan" id="pan"><img id="panImg" alt=""></div>
    <div class="vhint" id="vhint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>Drag to look around</div>
    <div class="tabs" id="tabs"></div>
  </div>
  <aside class="info" id="info">
    <div class="units" id="units"></div>
    <p class="eyebrow" id="pLevel"></p>
    <h2 id="pName"></h2>
    <p class="desc" id="pDesc"></p>
    <dl class="stats" id="pStats"></dl>
    <div class="plan"><h3>Floor plan</h3><div id="pPlan"></div></div>
    <p class="note">Concept demonstration. Imagery is AI-generated and all figures are illustrative.</p>
  </aside>
</section>

<script>
(function(){
  var AR = 3000/3724;
  var world = document.getElementById('world');
  var runway = document.getElementById('runway');
  var hotspots = [].slice.call(document.querySelectorAll('.hs'));
  var capA = document.getElementById('capA'), capB = document.getElementById('capB'), capC = document.getElementById('capC'), cue = document.getElementById('cue');
  var vw, vh, W0, H0, sFinal, hsOn = false;

  function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
  function ease(t){return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2}
  function lerp(a,b,t){return a+(b-a)*t}

  function layout(){
    vw = window.innerWidth; vh = window.innerHeight;
    if (vw/vh < AR){ W0 = vw; H0 = vw/AR; } else { H0 = vh; W0 = vh*AR; }
    world.style.width = W0+'px'; world.style.height = H0+'px';
    var target = 0.8*vh/(0.24*H0);
    sFinal = Math.min(target, vw < 700 ? 4.2 : 5);
    update();
  }

  function update(){
    var max = runway.offsetHeight - vh;
    var p = max > 0 ? clamp(window.scrollY/max,0,1) : 0;
    var e = ease(clamp(p/0.84,0,1));
    var s = lerp(1, sFinal, e);
    var fu = lerp(.5,.585,e), fv = lerp(.5,.385,e);
    var tx = vw/2 - s*fu*W0, ty = vh/2 - s*fv*H0;
    world.style.transform = 'translate3d('+tx+'px,'+ty+'px,0) scale('+s+')';
    world.style.setProperty('--s', s);

    capA.classList.toggle('on', p < .1);
    capB.classList.toggle('on', p > .3 && p < .56);
    capC.classList.toggle('on', p > .66 && p < .86);
    cue.style.opacity = p < .04 ? 1 : 0;

    var show = p > .86;
    if (show !== hsOn){ hsOn = show; hotspots.forEach(function(h){h.classList.toggle('show', show)}); }
  }

  var ticking = false;
  window.addEventListener('scroll', function(){ if(!ticking){ ticking = true; requestAnimationFrame(function(){ticking=false;update()}) } }, {passive:true});
  window.addEventListener('resize', layout);

  /* day / night */
  var toggles = [].slice.call(document.querySelectorAll('.toggle button'));
  function setMode(m){
    document.body.classList.toggle('night', m === 'night');
    toggles.forEach(function(b){ var on = b.dataset.mode === m; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on) });
  }
  toggles.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode) }) });

  /* ---------- unit data ---------- */
  var T = '<text x="240" y="66">TERRACE</text>';
  function frame(inner, extra){
    return '<svg viewBox="0 0 480 330" role="img" aria-label="Floor plan">' +
      '<path class="terr" d="M8 124 Q240 -14 472 124"/>' +
      '<path class="glass" d="M22 130 Q240 22 458 130"/>' +
      '<path class="wall" d="M22 130 L22 305 L458 305 L458 130"/>' + inner +
      '<path d="M226 312 L240 302 L254 312" fill="none" stroke="#d9b779" stroke-width="1.2"/><text x="240" y="324" style="font-size:7px;fill:#d9b779">ENTRY</text>' +
      '</svg>';
  }
  var planA = frame(
    '<path class="int" d="M300 80 V305 M300 215 H458 M22 232 H165 V305"/>' +
    '<text x="160" y="150">LIVING / DINING</text><text class="ar" x="160" y="162">64 m²</text>' +
    '<text x="93" y="270">KITCHEN</text><text class="ar" x="93" y="282">18 m²</text>' +
    '<text x="379" y="160">PRIMARY SUITE</text><text class="ar" x="379" y="172">34 m²</text>' +
    '<text x="379" y="262">BEDROOM 2</text><text class="ar" x="379" y="274">22 m²</text>' + T);
  var planB = frame(
    '<path class="int" d="M130 90 V305 M300 80 V305 M22 215 H130 M300 215 H458 M130 232 H215 V305"/>' +
    '<text x="215" y="150">LIVING / DINING</text><text class="ar" x="215" y="162">78 m²</text>' +
    '<text x="76" y="168">BEDROOM 3</text><text class="ar" x="76" y="180">20 m²</text>' +
    '<text x="76" y="262">STUDY</text><text class="ar" x="76" y="274">16 m²</text>' +
    '<text x="172" y="272">KITCHEN</text><text class="ar" x="172" y="284">22 m²</text>' +
    '<text x="379" y="160">PRIMARY SUITE</text><text class="ar" x="379" y="172">38 m²</text>' +
    '<text x="379" y="262">BEDROOM 2</text><text class="ar" x="379" y="274">24 m²</text>' + T);
  var planC = frame(
    '<path class="int" d="M120 92 V305 M360 92 V305 M22 215 H120 M360 215 H458"/>' +
    '<ellipse class="soft" cx="240" cy="206" rx="104" ry="70"/><rect class="soft" x="228" y="194" width="24" height="24" rx="2"/>' +
    '<text x="240" y="156">GREAT ROOM</text><text class="ar" x="240" y="167">DOUBLE HEIGHT · 118 m²</text>' +
    '<text x="71" y="164">BEDROOM 3</text><text class="ar" x="71" y="176">32 m²</text>' +
    '<text x="71" y="262">BEDROOM 4</text><text class="ar" x="71" y="274">30 m²</text>' +
    '<text x="409" y="160">PRIMARY SUITE</text><text class="ar" x="409" y="172">64 m²</text>' +
    '<text x="409" y="262">WELLNESS</text><text class="ar" x="409" y="274">36 m²</text>' +
    '<text x="240" y="66">POOL TERRACE</text>');

  var UNITS = {
    a:{name:'Garden Residence', level:'Level 03', beds:'2', baths:'2', area:'168', terr:'46',
       desc:'The lowest residence lives at the tree line. A planted terrace wraps the living room, with a banyan canopy and the lagoon at eye level.',
       views:[['Living','a_living'],['Bedroom','a_bed'],['Terrace','a_terrace']], plan:planA},
    b:{name:'Sky Residence', level:'Level 08', beds:'3', baths:'3', area:'236', terr:'28',
       desc:'A sweeping curved glass wall opens the whole living volume to the lagoon and skyline, set between warm walnut and pale limestone.',
       views:[['Living','b_living'],['Bedroom','b_bed'],['Balcony','b_terrace']], plan:planB},
    c:{name:'Penthouse', level:'Level 12', beds:'4', baths:'5', area:'412', terr:'140',
       desc:'A double-height great room beneath the floating roof plate, wrapped in glass, with a private pool terrace above the water.',
       views:[['Great room','c_living'],['Suite','c_bed'],['Pool terrace','c_terrace']], plan:planC}
  };
  var ORDER = ['a','b','c'];

  /* ---------- panel ---------- */
  var panel = document.getElementById('panel'), pan = document.getElementById('pan'), panImg = document.getElementById('panImg');
  var tabsEl = document.getElementById('tabs'), unitsEl = document.getElementById('units'), vhint = document.getElementById('vhint');
  var cur = null, curView = 0, ox = 0, iw = 0, cw = 0, lastFocus = null;

  function sizePan(){
    var r = pan.getBoundingClientRect(); cw = r.width;
    var ch = r.height;
    iw = Math.max(cw*1.45, ch*(2752/1536));
    panImg.style.width = iw+'px';
    ox = clamp(ox, cw-iw, 0); panImg.style.left = ox+'px';
  }
  function setView(i, keepPos){
    var u = UNITS[cur]; curView = i;
    var v = u.views[i];
    panImg.classList.add('fade');
    var im = new Image();
    im.onload = function(){
      panImg.src = im.src; panImg.alt = u.name+' — '+v[0];
      sizePan(); if(!keepPos){ ox = (cw-iw)/2; panImg.style.left = ox+'px'; }
      panImg.classList.remove('fade');
    };
    im.src = ''+v[1]+'.webp';
    [].forEach.call(tabsEl.children, function(b,k){ b.classList.toggle('on', k===i); b.setAttribute('aria-pressed', k===i) });
  }
  function fillUnit(id){
    cur = id; var u = UNITS[id];
    document.getElementById('pLevel').textContent = u.level;
    document.getElementById('pName').textContent = u.name;
    document.getElementById('pDesc').textContent = u.desc;
    document.getElementById('pStats').innerHTML =
      '<div><dt>Beds</dt><dd>'+u.beds+'</dd></div><div><dt>Baths</dt><dd>'+u.baths+'</dd></div><div><dt>Interior</dt><dd>'+u.area+'<small style="font-size:12px"> m²</small></dd></div><div><dt>Terrace</dt><dd>'+u.terr+'<small style="font-size:12px"> m²</small></dd></div>';
    document.getElementById('pPlan').innerHTML = u.plan;
    tabsEl.innerHTML = '';
    u.views.forEach(function(v,i){
      var b = document.createElement('button'); b.type='button'; b.className='tab'; b.textContent=v[0];
      b.addEventListener('click', function(){ setView(i) }); tabsEl.appendChild(b);
    });
    unitsEl.innerHTML = '';
    ORDER.forEach(function(k){
      var b = document.createElement('button'); b.type='button'; b.className='upill'+(k===id?' on':''); b.textContent=UNITS[k].name;
      b.addEventListener('click', function(){ if(k!==cur){ fillUnit(k); setView(0); document.getElementById('info').scrollTop = 0; } }); unitsEl.appendChild(b);
    });
  }
  function openPanel(id){
    lastFocus = document.activeElement;
    fillUnit(id); setView(0);
    vhint.classList.remove('gone');
    panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); document.body.classList.add('locked');
    setTimeout(function(){ document.getElementById('closeBtn').focus({preventScroll:true}); sizePan() }, 60);
  }
  function closePanel(){
    panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); document.body.classList.remove('locked');
    if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  }
  hotspots.forEach(function(h){ h.addEventListener('click', function(){ openPanel(h.dataset.unit) }) });
  document.getElementById('closeBtn').addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e){
    if(!panel.classList.contains('open')) return;
    if(e.key === 'Escape') closePanel();
    if(e.key === 'ArrowLeft'){ ox = clamp(ox+80, cw-iw, 0); panImg.style.left = ox+'px'; vhint.classList.add('gone') }
    if(e.key === 'ArrowRight'){ ox = clamp(ox-80, cw-iw, 0); panImg.style.left = ox+'px'; vhint.classList.add('gone') }
  });

  /* drag to pan */
  var dragging = false, sx = 0, sox = 0, vel = 0, lastX = 0, raf = 0;
  pan.addEventListener('pointerdown', function(e){
    dragging = true; sx = e.clientX; sox = ox; lastX = e.clientX; vel = 0; cancelAnimationFrame(raf);
    pan.classList.add('drag'); pan.setPointerCapture(e.pointerId); vhint.classList.add('gone');
  });
  pan.addEventListener('pointermove', function(e){
    if(!dragging) return;
    vel = e.clientX - lastX; lastX = e.clientX;
    ox = clamp(sox + (e.clientX - sx), cw-iw, 0); panImg.style.left = ox+'px';
  });
  function endDrag(){
    if(!dragging) return; dragging = false; pan.classList.remove('drag');
    (function glide(){
      vel *= .94; if(Math.abs(vel) < .3) return;
      ox = clamp(ox+vel, cw-iw, 0); panImg.style.left = ox+'px'; raf = requestAnimationFrame(glide);
    })();
  }
  pan.addEventListener('pointerup', endDrag); pan.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', function(){ if(panel.classList.contains('open')) sizePan() });

  /* loader: wait for both exterior images */
  var imgs = [document.getElementById('dayLayer'), document.getElementById('nightLayer')];
  var left = imgs.length;
  function ready(){ if(--left <= 0){ document.getElementById('loader').classList.add('done'); } }
  imgs.forEach(function(im){ if(im.complete) ready(); else { im.addEventListener('load', ready); im.addEventListener('error', ready); } });
  setTimeout(function(){ document.getElementById('loader').classList.add('done') }, 6000);

  layout();
})();
</script>
</body>
